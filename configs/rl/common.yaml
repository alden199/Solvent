training:
  train_backend: megatron
  colocate: true
  no_load_optim: true
  no_load_rng: true
  finetune: true
  save_interval: 25
  input_key: prompt
  label_key: label
  tool_key: tools
  rollout_shuffle: true
  num_epoch: 5
  n_samples_per_prompt: 8
  rollout_max_context_len: 32768
  rollout_max_response_len: 30000
  rollout_top_k: -1
  global_batch_size: 512
  balance_data: true
  advantage_estimator: gspo
  eps_clip: 0.2
  eps_clip_high: 0.28
  use_tis: true
  tis_clip: 5
  tis_clip_low: 0
  kl_coef: 0.0
  entropy_coef: 0.0
  optimizer: adam
  lr: 1.0e-6
  lr_decay_style: constant
  lr_warmup_iters: 20
  weight_decay: 0.05
  adam_beta1: 0.9
  adam_beta2: 0.98
  tensor_model_parallel_size: 2
  sequence_parallel: true
  pipeline_model_parallel_size: 1
  context_parallel_size: 1
  expert_model_parallel_size: 1
  expert_tensor_parallel_size: 1
  recompute_granularity: full
  recompute_method: uniform
  recompute_num_layers: 1
  use_dynamic_batch_size: true
  max_tokens_per_gpu: 32768
  rollout_num_gpus_per_engine: 1
  sglang_mem_fraction_static: 0.7
  rollout_health_check_first_wait: 180
  attention_dropout: 0.0
  hidden_dropout: 0.0
  accumulate_allreduce_grads_in_fp32: true
  attention_softmax_in_fp32: true
  attention_backend: flash
  rollout_function_path: slime.rollout.sglang_rollout.generate_rollout
  custom_generate_function_path: solvent.rl.generate_with_emol.generate
  custom_rm_path: solvent.rl.generate_with_emol.reward_func
  rollout_sample_filter_path: solvent.rl.generate_with_emol.mask_truncated_samples_for_loss
  log_passrate: true
  log_multi_turn: true
  log_reward_category: success
model:
  swiglu: true
  num_layers: 36
  hidden_size: 4096
  ffn_hidden_size: 12288
  num_attention_heads: 32
  group_query_attention: true
  num_query_groups: 8
  use_rotary_position_embeddings: true
  disable_bias_linear: true
  normalization: RMSNorm
  norm_epsilon: 1.0e-6
  rotary_base: 1000000
  vocab_size: 151936
  kv_channels: 128
  qk_layernorm: true
  untie_embeddings_and_output_weights: true
reward:
  max_turns: 5
  retro_emol_max_context_len: 32768
  reward_key: score
  retro_emol_success_reward_weight: 0.6
  retro_emol_final_route_stock_checked_reward_weight: 0.2
  retro_emol_tool_trace_valid_reward_weight: 0.2
  retro_emol_core_chemical_validity_enable: true
  retro_emol_top_n_templates: 10000
  retro_emol_atom_sanity_mode: core
  retro_emol_max_missing_oxygen: 2
  retro_emol_mask_truncated_samples_for_loss: true
  retro_emol_repetition_penalty: 1.0
