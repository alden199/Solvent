stage: sft
do_train: true
finetuning_type: full
trust_remote_code: false
template: qwen3_nothink
mix_strategy: concat
eval_on_each_dataset: true
cutoff_len: 32768
val_size: 100
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 1
num_train_epochs: 1.0
learning_rate: 2.0e-5
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr: 1.0e-6
warmup_steps: 0
warmup_ratio: 0.05
seed: 42
packing: false
mask_history: false
train_on_prompt: false
answer_only_loss: false
weighted_sft_loss: false
reasoning_loss_weight: 1.0
tool_call_loss_weight: 1.0
answer_loss_weight: 1.0
answer_loss_marker: <answer>
gradient_checkpointing: true
optim: adamw_torch
weight_decay: 0.0
max_grad_norm: 1.0
save_strategy: steps
save_steps: 5
eval_strategy: steps
eval_steps: 5
logging_steps: 1
log_sft_entropy: true
log_sft_entropy_sample_size: 0
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
save_only_model: false
overwrite_output_dir: false
overwrite_cache: false
data_shared_file_system: true
preprocessing_num_workers: 8
dataloader_num_workers: 4
plot_loss: true
report_to: none
bf16: true
ddp_timeout: 1800
